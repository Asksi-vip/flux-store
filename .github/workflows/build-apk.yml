# بناء APK تلقائيًا عبر GitHub Actions — لا يحتاج Flutter SDK على جهازك.
# يعمل عند كل push إلى main، ويمكن تشغيله يدويًا من تبويب Actions.
# الناتج: ملف flux-store.apk في الـ Artifacts وفي صفحة Releases.
name: Build Flux APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: جلب الكود
        uses: actions/checkout@v4

      - name: تثبيت Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: تثبيت Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: "3.24.5"
          cache: true

      # مجلد android غير مخزّن في الـ repo (يبقى خفيفًا) — يُولَّد هنا في كل بناء
      - name: توليد مجلد الأندرويد
        working-directory: app
        run: flutter create . --platforms android --org com.fluxstore

      # ضروري: صلاحية الإنترنت + التخزين + الخلفية (Foreground Service) + الإشعارات + تثبيت APK
      - name: ضبط الـ AndroidManifest
        working-directory: app
        run: |
          python3 - <<'PY'
          p = "android/app/src/main/AndroidManifest.xml"
          s = open(p, encoding="utf-8").read()
          perms = {
              "android.permission.INTERNET": '<uses-permission android:name="android.permission.INTERNET"/>\n    ',
              "android.permission.WRITE_EXTERNAL_STORAGE": '<uses-permission android:name="android.permission.WRITE_EXTERNAL_STORAGE"/>\n    ',
              "android.permission.MANAGE_EXTERNAL_STORAGE": '<uses-permission android:name="android.permission.MANAGE_EXTERNAL_STORAGE"/>\n    ',
              "android.permission.FOREGROUND_SERVICE": '<uses-permission android:name="android.permission.FOREGROUND_SERVICE"/>\n    ',
              "android.permission.FOREGROUND_SERVICE_DATA_SYNC": '<uses-permission android:name="android.permission.FOREGROUND_SERVICE_DATA_SYNC"/>\n    ',
              "android.permission.POST_NOTIFICATIONS": '<uses-permission android:name="android.permission.POST_NOTIFICATIONS"/>\n    ',
              "android.permission.WAKE_LOCK": '<uses-permission android:name="android.permission.WAKE_LOCK"/>\n    ',
              "android.permission.REQUEST_INSTALL_PACKAGES": '<uses-permission android:name="android.permission.REQUEST_INSTALL_PACKAGES"/>\n    ',
          }
          for perm, tag in perms.items():
              if perm not in s:
                  s = s.replace("<application", tag + "<application", 1)
          if "usesCleartextTraffic" not in s:
              s = s.replace(
                  "<application",
                  '<application\n        android:usesCleartextTraffic="true"',
                  1,
              )
          if "requestLegacyExternalStorage" not in s:
              s = s.replace(
                  "<application",
                  '<application\n        android:requestLegacyExternalStorage="true"',
                  1,
              )
          if "DownloadService" not in s:
              s = s.replace(
                  "</application>",
                  '        <service\n'
                  '            android:name="com.fluxstore.flux_store.DownloadService"\n'
                  '            android:exported="false"\n'
                  '            android:foregroundServiceType="dataSync"/>\n'
                  '        <provider\n'
                  '            android:name="androidx.core.content.FileProvider"\n'
                  '            android:authorities="com.fluxstore.flux_store.fileprovider"\n'
                  '            android:exported="false"\n'
                  '            android:grantUriPermissions="true">\n'
                  '            <meta-data\n'
                  '                android:name="android.support.FILE_PROVIDER_PATHS"\n'
                  '                android:resource="@xml/file_paths"/>\n'
                  '        </provider>\n'
                  "    </application>",
                  1,
              )
          s = s.replace('android:label="flux_store"', 'android:label="Flux"')
          open(p, "w", encoding="utf-8").write(s)
          print(s)
          PY

      # خدمة الخلفية (إشعار تقدم + WakeLock) + مثبّت الـ APK عبر FileProvider
      - name: حقن خدمة التحميل بالخلفية ومثبّت الـ APK (Kotlin)
        working-directory: app
        run: |
          python3 - <<'PY'
          import os
          import textwrap

          base = "android/app/src/main/kotlin/com/fluxstore/flux_store"
          os.makedirs(base, exist_ok=True)

          service = textwrap.dedent(r'''
              package com.fluxstore.flux_store

              import android.app.Notification
              import android.app.NotificationChannel
              import android.app.NotificationManager
              import android.app.Service
              import android.content.Context
              import android.content.Intent
              import android.os.Build
              import android.os.IBinder
              import android.os.PowerManager

              /** خدمة أمامية للتحميلات: إشعار تقدم + WakeLock — التحميل يكمل بالخلفية مثل Epic Games. */
              class DownloadService : Service() {

                  private var wakeLock: PowerManager.WakeLock? = null

                  override fun onBind(intent: Intent?): IBinder? = null

                  override fun onStartCommand(intent: Intent?, flags: Int, startId: Int): Int {
                      when (intent?.action) {
                          ACTION_START -> {
                              ensureChannel()
                              startForeground(
                                  NOTIF_ID,
                                  buildNotification(
                                      intent.getStringExtra("title") ?: "تحميل لعبة",
                                      "",
                                      null
                                  )
                              )
                              acquireWakeLock()
                          }
                          ACTION_UPDATE -> {
                              val nm = getSystemService(Context.NOTIFICATION_SERVICE) as NotificationManager
                              nm.notify(
                                  NOTIF_ID,
                                  buildNotification(
                                      intent.getStringExtra("title") ?: "تحميل لعبة",
                                      intent.getStringExtra("progress") ?: "",
                                      null
                                  )
                              )
                          }
                          ACTION_STOP -> {
                              releaseWakeLock()
                              stopForeground(true)
                              stopSelf()
                          }
                      }
                      return START_STICKY
                  }

                  private fun buildNotification(title: String, progressText: String, progress: Float?): Notification {
                      val style = if (Build.VERSION.SDK_INT >= 26) {
                          Notification.Builder(this, CHANNEL_ID)
                      } else {
                          @Suppress("DEPRECATION")
                          Notification.Builder(this)
                      }
                      style.setContentTitle(title)
                          .setSmallIcon(android.R.drawable.stat_sys_download)
                          .setOngoing(true)
                          .setOnlyAlertOnce(true)
                      if (progressText != "") style.setContentText(progressText)
                      if (progress != null && progress > 0) {
                          style.setProgress(100, (progress * 100).toInt(), false)
                      } else {
                          style.setProgress(0, 0, true)
                      }
                      return style.build()
                  }

                  private fun ensureChannel() {
                      if (Build.VERSION.SDK_INT >= 26) {
                          val nm = getSystemService(Context.NOTIFICATION_SERVICE) as NotificationManager
                          val ch = NotificationChannel(
                              CHANNEL_ID,
                              "تحميلات الألعاب",
                              NotificationManager.IMPORTANCE_LOW
                          )
                          ch.setShowBadge(false)
                          nm.createNotificationChannel(ch)
                      }
                  }

                  private fun acquireWakeLock() {
                      try {
                          if (wakeLock?.isHeld == true) return
                          val pm = getSystemService(Context.POWER_SERVICE) as PowerManager
                          wakeLock = pm.newWakeLock(PowerManager.PARTIAL_WAKE_LOCK, "flux:downloads")
                          wakeLock?.acquire(4 * 60 * 60 * 1000L)
                      } catch (_: Exception) {
                      }
                  }

                  private fun releaseWakeLock() {
                      try {
                          wakeLock?.let { if (it.isHeld) it.release() }
                      } catch (_: Exception) {
                      }
                      wakeLock = null
                  }

                  override fun onDestroy() {
                      releaseWakeLock()
                      super.onDestroy()
                  }

                  companion object {
                      const val CHANNEL_ID = "flux_downloads"
                      const val NOTIF_ID = 42
                      const val ACTION_START = "flux.action.START"
                      const val ACTION_UPDATE = "flux.action.UPDATE"
                      const val ACTION_STOP = "flux.action.STOP"
                  }
              }
              ''').strip() + "\n"

          main_activity = textwrap.dedent(r'''
              package com.fluxstore.flux_store

              import android.content.Intent
              import androidx.core.content.ContextCompat
              import androidx.core.content.FileProvider
              import io.flutter.embedding.android.FlutterActivity
              import io.flutter.embedding.engine.FlutterEngine
              import io.flutter.plugin.common.MethodChannel
              import java.io.File

              /** MainActivity مع قناة flux.background: خدمة الخلفية + فتح مثبّت الـ APK بعد اكتمال التحميل. */
              class MainActivity : FlutterActivity() {

                  override fun configureFlutterEngine(flutterEngine: FlutterEngine) {
                      super.configureFlutterEngine(flutterEngine)
                      MethodChannel(flutterEngine.dartExecutor.binaryMessenger, "flux.background")
                          .setMethodCallHandler { call, result ->
                              val intent = Intent(this, DownloadService::class.java)
                              when (call.method) {
                                  "start" -> {
                                      intent.action = DownloadService.ACTION_START
                                      intent.putExtra("title", call.argument<String>("title") ?: "تحميل لعبة")
                                      ContextCompat.startForegroundService(this, intent)
                                      result.success(null)
                                  }
                                  "update" -> {
                                      intent.action = DownloadService.ACTION_UPDATE
                                      intent.putExtra("title", call.argument<String>("title") ?: "تحميل لعبة")
                                      intent.putExtra("progress", call.argument<String>("progress") ?: "")
                                      startService(intent)
                                      result.success(null)
                                  }
                                  "stop" -> {
                                      intent.action = DownloadService.ACTION_STOP
                                      startService(intent)
                                      result.success(null)
                                  }
                                  "installApk" -> {
                                      val path = call.argument<String>("path") ?: ""
                                      try {
                                          val file = File(path)
                                          if (file.exists() && file.length() > 0) {
                                              val uri = FileProvider.getUriForFile(
                                                  this,
                                                  packageName + ".fileprovider",
                                                  file
                                              )
                                              val install = Intent(Intent.ACTION_VIEW)
                                              install.setDataAndType(
                                                  uri,
                                                  "application/vnd.android.package-archive"
                                              )
                                              install.addFlags(Intent.FLAG_GRANT_READ_URI_PERMISSION)
                                              install.addFlags(Intent.FLAG_ACTIVITY_NEW_TASK)
                                              startActivity(install)
                                              result.success(true)
                                          } else {
                                              result.success(false)
                                          }
                                      } catch (e: Exception) {
                                          result.success(false)
                                      }
                                  }
                                  else -> result.notImplemented()
                              }
                          }
                  }
              }
              ''').strip() + "\n"

          with open(os.path.join(base, "DownloadService.kt"), "w", encoding="utf-8") as f:
              f.write(service)
          with open(os.path.join(base, "MainActivity.kt"), "w", encoding="utf-8") as f:
              f.write(main_activity)

          # مسارات FileProvider لمشاركة ملف الـ APK مع مثبّت النظام
          res_xml = "android/app/src/main/res/xml"
          os.makedirs(res_xml, exist_ok=True)
          file_paths = (
              '<?xml version="1.0" encoding="utf-8"?>\n'
              "<paths>\n"
              '    <root-path name="root" path="." />\n'
              '    <external-path name="external" path="." />\n'
              '    <external-files-path name="external_files" path="." />\n'
              '    <files-path name="files" path="." />\n'
              "</paths>\n"
          )
          with open(os.path.join(res_xml, "file_paths.xml"), "w", encoding="utf-8") as f:
              f.write(file_paths)
          print("Kotlin files written:")
          for fn in os.listdir(base):
              print(" -", fn)
          PY

      - name: تثبيت الاعتماديات
        working-directory: app
        run: flutter pub get

      - name: بناء نسخة الإطلاق
        working-directory: app
        run: flutter build apk --release

      - name: تجهيز الملف النهائي
        run: |
          mkdir -p dist
          cp app/build/app/outputs/flutter-apk/app-release.apk dist/flux-store.apk
          ls -lh dist/

      - name: رفع الـ APK كـ Artifact
        uses: actions/upload-artifact@v4
        with:
          name: flux-store-apk
          path: dist/flux-store.apk

      - name: نشر الـ APK في Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: "Flux APK — بناء #${{ github.run_number }}"
          files: dist/flux-store.apk
          body: |
            بناء تلقائي (release) لتطبيق **Flux — متجر الألعاب بأسلوب Epic Games**.
            حمّل `flux-store.apk` من الأسفل (Assets)، ثم ثبّته على هاتفك.
            الملفات: admin.php + db.php تنشر على استضافتك serv00 داخل public_html/flux/api.
