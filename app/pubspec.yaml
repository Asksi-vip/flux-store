name: flux_store
description: "Flux — متجر ألعاب بتصميم نيون مستوحى من أجواء Vice City، متصل بـ Django REST API."
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  # الاتصال بالـ API
  dio: ^5.4.0
  # حفظ المكتبة محليًا على الجهاز
  shared_preferences: ^2.2.2

  cupertino_icons: ^1.0.6

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
