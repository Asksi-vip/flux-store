{% extends "admin/base.html" %}
{% load i18n %}

{% block title %}{{ title }} | Flux Store{% endblock %}

{% block branding %}
<div id="flux-branding">
  <span class="flux-logo">FLUX</span>
  <span class="flux-sub">لوحة تحكم المتجر</span>
</div>
{% endblock %}

{% block extrastyle %}
<style>
  /* ثيم Flux النيوني — خلفية داكنة ووردي متوهج مستوحى من Vice City */
  :root {
    --flux-pink: #ff2d78;
    --flux-purple: #8b2ff7;
    --flux-cyan: #00e5ff;
    --flux-orange: #ff7a18;
    --flux-bg: #0d0b1e;
    --flux-surface: #181233;
    --flux-card: #1c1538;
    --flux-muted: #a99fd6;
  }

  body {
    background: var(--flux-bg) !important;
    color: #fff !important;
  }

  /* الروابط */
  a:link, a:visited { color: var(--flux-pink); }
  a:hover { color: var(--flux-cyan); }

  /* الشريط العلوي بتدرج وردي-بنفسجي متوهج */
  #header {
    background: linear-gradient(90deg, var(--flux-pink), var(--flux-purple)) !important;
    box-shadow: 0 2px 18px rgba(255, 45, 120, .45);
    color: #fff;
  }
  #branding h1, #branding h1 a:link {
    color: #fff !important;
    font-weight: 800;
    letter-spacing: 1px;
  }
  #user-tools a:link, #user-tools a:visited {
    color: #fff;
    border-bottom: 1px solid rgba(255, 255, 255, .5);
  }
  #user-tools a:hover { color: var(--flux-cyan); border-bottom-color: var(--flux-cyan); }

  /* شعار FLUX داخل الشريط العلوي */
  #flux-branding { display: flex; align-items: baseline; gap: 10px; padding: 8px 0 2px; }
  .flux-logo {
    font-size: 22px; font-weight: 900; letter-spacing: 4px; color: #fff;
    text-shadow: 0 0 12px rgba(255, 255, 255, .8);
  }
  .flux-sub { font-size: 12px; color: rgba(255, 255, 255, .85); }

  /* مسار التنقل (Breadcrumbs) */
  div.breadcrumbs { background: var(--flux-surface) !important; color: var(--flux-muted) !important; border-bottom: 1px solid rgba(139, 47, 247, .3); }
  div.breadcrumbs a { color: var(--flux-cyan) !important; }

  /* البطاقات والوحدات */
  .module {
    background: var(--flux-card) !important;
    border: 1px solid rgba(139, 47, 247, .35) !important;
    border-radius: 14px !important;
    box-shadow: 0 6px 24px rgba(0, 0, 0, .35);
    overflow: hidden;
  }
  .module h2, .module caption, .inline-group h2 {
    background: linear-gradient(90deg, rgba(255, 45, 120, .3), rgba(139, 47, 247, .3)) !important;
    color: #fff !important;
    font-weight: 700;
  }

  /* الجداول */
  th, td { border-bottom: 1px solid rgba(139, 47, 247, .2) !important; }
  thead th { background: var(--flux-surface) !important; color: #fff !important; }
  tbody tr:hover td, tbody tr:hover th { background: rgba(255, 45, 120, .07) !important; }

  /* حقول النماذج */
  .fieldset { border: 1px solid rgba(139, 47, 247, .35) !important; border-radius: 14px !important; background: var(--flux-card) !important; }
  .fieldset h2 { color: #fff !important; }
  label { color: var(--flux-muted) !important; }
  input[type="text"], input[type="number"], input[type="url"], input[type="password"],
  input[type="email"], input[type="date"], textarea, select, .vTextField {
    background: var(--flux-surface) !important;
    color: #fff !important;
    border: 1px solid rgba(139, 47, 247, .4) !important;
    border-radius: 8px !important;
  }
  input:focus, textarea:focus, select:focus {
    border-color: var(--flux-pink) !important;
    box-shadow: 0 0 8px rgba(255, 45, 120, .5) !important;
    outline: none !important;
  }
  .help, .help-text { color: var(--flux-muted) !important; }

  /* الأزرار */
  input[type="submit"], button, .button, .submit-row input {
    background: var(--flux-surface) !important;
    color: #fff !important;
    border: 1px solid rgba(139, 47, 247, .5) !important;
    border-radius: 10px !important;
  }
  input[type="submit"].default, .submit-row input.default, button.default {
    background: linear-gradient(90deg, var(--flux-pink), var(--flux-purple)) !important;
    border: none !important;
    color: #fff !important;
    font-weight: 700;
    box-shadow: 0 2px 14px rgba(255, 45, 120, .5);
  }
  .button:hover, input[type="submit"]:hover { border-color: var(--flux-cyan) !important; }
  a.deletelink { color: var(--flux-orange) !important; }

  /* الشريط الجانبي للفلترة */
  #changelist-filter { background: var(--flux-surface) !important; border-radius: 14px; }
  #changelist-filter h2 { background: transparent !important; color: var(--flux-cyan) !important; }
  #changelist-filter li a { color: var(--flux-muted) !important; }
  #changelist-filter li.selected a { color: var(--flux-pink) !important; font-weight: 700; }

  /* تقسيم الصفحات ورسائل النجاح */
  .paginator { color: var(--flux-muted) !important; }
  .messagelist .success { background: rgba(0, 229, 255, .12) !important; color: var(--flux-cyan) !important; border: 1px solid rgba(0, 229, 255, .4); border-radius: 10px; }
  .messagelist .warning { background: rgba(255, 122, 24, .12) !important; color: var(--flux-orange) !important; border: 1px solid rgba(255, 122, 24, .4); border-radius: 10px; }
</style>
{% endblock %}
